services:
  - type: web
    name: lyftr-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DEFAULT_MODEL
        value: gemini/gemini-2.0-flash
      - key: ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:3000
      - key: LLM_API_KEYS
        sync: false
